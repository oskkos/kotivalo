schema: spec-driven

# Project context (optional)
# This is shown to AI when creating artifacts.
# Add your tech stack, conventions, style guides, domain knowledge, etc.
# Example:
#   context: |
#     Tech stack: TypeScript, React, Node.js
#     We use conventional commits
#     Domain: e-commerce platform

rules:
  specs:
    - Name each requirement uniquely across all specs; tests match it by name with test.describe('<Requirement>').
    - Every scenario gets a test named test('<Scenario>') inside that describe (Vitest or Playwright).
    - Every requirement gets a Playwright test, unless it can't be tested in a browser. Then record why on its own line in the requirement text, `**No Playwright test:** <reason>`, and cover its scenarios with Vitest.
    - Avoid " > " in requirement and scenario names.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
# Example:
#   rules:
#     proposal:
#       - Keep proposals under 500 words
#       - Always include a "Non-goals" section
#     tasks:
#       - Break tasks into chunks of max 2 hours
