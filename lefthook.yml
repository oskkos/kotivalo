# Git hooks: fast local feedback before CI. CI stays the authority, and
# `git commit --no-verify` / `git push --no-verify` skip them.
# Installed by `pnpm install` (the "prepare" script runs `lefthook install`).

commit-msg:
  commands:
    commitlint:
      run: pnpm exec commitlint --edit {1}

pre-commit:
  # Staged files only. ESLint fixes first, then Prettier formats the result.
  piped: true
  commands:
    eslint:
      glob: '*.{js,ts,tsx}'
      run: pnpm exec eslint --fix --no-warn-ignored {staged_files}
      stage_fixed: true
    prettier:
      run: pnpm exec prettier --write --ignore-unknown {staged_files}
      stage_fixed: true

pre-push:
  parallel: true
  commands:
    typecheck:
      run: pnpm typecheck
    unit:
      run: pnpm exec vitest run --project unit
