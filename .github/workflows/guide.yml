name: Guide

# The user guide (docs/guide): the screenshots are captured from the built app,
# the site is built, and on develop it is deployed to its own Worker at
# ohje.kotivalo.app. Runs only when something the guide shows can have changed.
# Not a required check: a path-filtered workflow that doesn't run would block
# merges as a required one. A capture script that breaks still fails here.
on:
  pull_request:
    branches: [develop]
    paths: &paths
      - 'src/**'
      - 'messages/**'
      - 'public/**'
      - 'migrations/**'
      - 'openspec/specs/**'
      - 'docs/guide/**'
      - 'e2e/support/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - '.github/workflows/guide.yml'
  push:
    branches: [develop]
    paths: *paths
  workflow_dispatch:

concurrency:
  group: guide-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  guide:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      - name: Get Playwright version
        id: playwright
        run: echo "version=$(pnpm exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}
      - name: Install Chromium and its system dependencies
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --with-deps chromium
      - name: Install Chromium system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm exec playwright install-deps chromium
      # The capture builds the app and serves it (the config's web server).
      - run: pnpm guide:capture
      - run: pnpm --filter kotivalo-guide check
      - run: pnpm guide:build
        env:
          GUIDE_STRICT: '1'
      # On a PR, to look at; on develop, for the deploy job.
      - name: Upload the site
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-site
          path: docs/guide/dist/
          retention-days: 14
      - name: Upload the capture report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: guide-capture-report
          path: test-results/guide/
          retention-days: 14

  # After every push to develop that touched the guide's inputs.
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/develop'
    needs: [guide]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    # One deploy at a time; a running deploy is never cancelled.
    concurrency:
      group: deploy-guide
      cancel-in-progress: false
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup
      # The site as the guide job built it, with its screenshots.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: guide-site
          path: docs/guide/dist/
      - run: pnpm exec wrangler deploy --config docs/guide/wrangler.jsonc
